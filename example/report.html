<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>alaya example/trajectory</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:13px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
color:#1a1a1a;background:#fff}
code,pre,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
#layout{display:flex;height:100vh}
#side{width:440px;min-width:280px;max-width:65vw;display:flex;flex-direction:column;
border-right:1px solid #ddd;background:#fafafa;resize:horizontal;overflow:hidden}
#tools{display:flex;gap:5px;padding:8px;border-bottom:1px solid #e6e6e6;background:#f2f3f5}
#find{flex:1;min-width:0;padding:3px 7px;border:1px solid #ccc;border-radius:3px;font:inherit}
#found{align-self:center;font-size:11px;color:#777;white-space:nowrap}
button.tool{font-size:11px;padding:2px 8px;border:1px solid #ccc;background:#fff;
border-radius:3px;cursor:pointer;color:#444;white-space:nowrap}
button.tool:hover{background:#eef1f5}
#tree{flex:1;overflow:auto;padding:8px 8px 40vh}
#detail{flex:1;overflow:auto;padding:18px 22px}
h1{font-size:14px;margin:0 0 10px;letter-spacing:.02em;text-transform:uppercase;color:#666}
h2{font-size:13px;margin:22px 0 8px;text-transform:uppercase;letter-spacing:.03em;color:#666;
border-bottom:1px solid #eee;padding-bottom:4px}
/* A chain grows straight down at the same indentation; a fork is the only thing that indents,
   and only a fork draws a rail, so a line on the left always marks a set of siblings. */
.branch{border-left:2px solid #c3cbd4;margin-left:9px;padding-left:13px}
.forks{margin-top:2px}
/* An elbow from the rail into the row that starts a branch, so the first state of a sibling
   cannot be mistaken for one more row of the branch above it. */
.branch>.node:first-child::before{content:'';position:absolute;left:-13px;top:11px;width:11px;
border-top:2px solid #c3cbd4}
.hide{display:none}
.node{position:relative;display:flex;align-items:baseline;width:100%;text-align:left;border:0;
background:none;padding:2px 5px;border-radius:4px;cursor:pointer;font:inherit;color:inherit}
.node:hover{background:#eef1f5}
.node.on{background:#dce7f5;font-weight:600}
.node.hit{outline:1px solid #c8a02a;background:#fdf6e0}
.tw{flex:none;display:inline-flex;align-items:center;justify-content:center;width:16px;
height:14px;color:#5a6570;cursor:pointer;user-select:none}
.tw:hover{color:#000}
.tw.leaf{color:#b3bcc5;cursor:default}
.sum{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.count{flex:none;color:#8a94a0;font-size:11px;margin-left:6px}
.hash{color:#8a6d3b}
.ic{flex:none;display:inline-flex;align-items:center;justify-content:center;width:16px;
height:14px;margin-right:5px}
.i-root{color:#4a4a4a}.i-turn{color:#3a6ea5}
.i-intervention{color:#7a5aa5}.i-pass{color:#2f7d4f}.i-fail{color:#b02020}
.i-message{color:#7a5aa5}.i-question{color:#c07a1a}.i-reply{color:#2f7d4f}
.chip{display:inline-block;padding:0 6px;border-radius:9px;font-size:11px;margin-left:6px;
background:#eee;color:#444}
.chip.ok{background:#d8f0dd;color:#1c5c33}.chip.bad{background:#f7dcdc;color:#8a2b2b}
.chip.wait{background:#fbe9cf;color:#7a4a08}
table.meta{border-collapse:collapse;margin-bottom:4px}
table.meta td{padding:2px 14px 2px 0;vertical-align:top}
table.meta td:first-child{color:#777;white-space:nowrap}
.msg{border:1px solid #e3e3e3;border-radius:5px;margin:8px 0;overflow:hidden}
.msg>.head{padding:4px 9px;background:#f4f6f8;font-size:11px;text-transform:uppercase;
letter-spacing:.04em;color:#555;border-bottom:1px solid #e3e3e3}
.msg>.body{padding:8px 10px}
.msg .head .id{margin-left:10px;color:#8a94a0;text-transform:none;letter-spacing:0}
pre{margin:0;white-space:pre-wrap;word-break:break-word}
.cmd{background:#1f2430;color:#e6e6e6;padding:8px 10px;border-radius:4px;margin:6px 0}
.cmd .rc{float:right;color:#9fb3c8}
.cmd .name{color:#9fb3c8;margin-right:8px}
.field{margin:4px 0}
.field .key{color:#777;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.fold{position:relative}
.fold.closed .clip{max-height:16em;overflow:hidden}
.fold.closed .clip:after{content:'';position:absolute;left:0;right:0;bottom:26px;height:40px;
background:linear-gradient(transparent,#fff)}
.fold>button{margin-top:6px;font-size:11px;padding:2px 8px;border:1px solid #ccc;background:#fff;
border-radius:3px;cursor:pointer;color:#444}
.file{border:1px solid #e3e3e3;border-radius:5px;margin:6px 0}
.file>summary{padding:5px 9px;cursor:pointer;background:#f7f8fa;border-radius:4px}
.file[open]>summary{border-bottom:1px solid #e3e3e3}
.path{font-family:ui-monospace,monospace}
.tag{display:inline-block;width:14px;text-align:center;font-weight:700;margin-right:6px}
.added{color:#1c7c3c}.removed{color:#b02020}.modified{color:#8a6d00}
.stat{float:right;color:#777;font-size:11px}
.diff{padding:0;margin:0;overflow-x:auto}
.diff div{padding:0 9px;white-space:pre;font-family:ui-monospace,monospace;font-size:12px}
.diff .plus{background:#e6f6ea}.diff .minus{background:#fdeaea}.diff .gap{background:#f5f5f5;
color:#999;text-align:center}
.muted{color:#888}
.big{color:#888;font-style:italic;padding:6px 9px}
.file.folded{padding:5px 9px;background:#f7f8fa;color:#777}
.headbar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.headbar h1{margin:0}
/* The model's context, in a modal over the page: what a continuation from the selected state
   is sampled from, in the form the provider receives. */
#modal{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
background:rgba(20,24,32,.55)}
#modal.hide{display:none}
#modal .win{width:min(1100px,94vw);height:min(90vh,1400px);display:flex;flex-direction:column;
background:#fff;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
#modal .bar{display:flex;gap:6px;align-items:center;padding:8px 12px;background:#f4f6f8;
border-bottom:1px solid #e3e3e3;border-radius:6px 6px 0 0}
#modal .ttl{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;
white-space:nowrap}
#modal-body{flex:1;overflow:auto;padding:12px 16px}
#modal-body .note{color:#666;font-size:12px;margin:0 0 10px}
.msg.mine{border-left:3px solid #3a6ea5}
.divider{margin:16px 0 6px;padding-top:4px;border-top:1px dashed #3a6ea5;color:#3a6ea5;
font-size:11px;text-transform:uppercase;letter-spacing:.04em}
</style></head>

 every act leaves an imprint, imprints accumulate, and later conditions cause\nthem to ripen. The language takes that literally.\n\nThree things make Bija unlike most imperative languages, and everything else about it is\ndeliberately ordinary:\n\n1. **A variable is a stack of generations, not a cell.** Assignment does not overwrite; it\n   plants a new generation on top of the old ones, and every earlier generation stays readable\n   through the `@` operator.\n2. **A block can be undone.** An `attempt` block that reaches `wither` rolls the storehouse\n   back to the state it had when the block began.\n3. **An effect can be deferred until a condition ripens.** `ripen when` registers a block that\n   runs later, at the first point where its condition holds.\n\nThis document specifies the language exactly. Where it says *error*, an implementation must\nreport an error; where it says *unspecified*, it must not.\n\n---\n\n## 1. Notation\n\nGrammar rules use EBNF: `|` alternation, `{ }` zero or more, `[ ]` optional, `( )` grouping,\n`\"x\"` a literal token. Nonterminals are lowercase. The grammar is over the token stream of §2.\n\n---\n\n## 2. Lexical structure\n\nA source file is a sequence of Unicode characters encoded in UTF-8. It is converted to a token\nstream by the rules below; the longest match wins at every position.\n\n### 2.1 Whitespace and comments\n\nSpaces (U+0020), tabs (U+0009), carriage returns (U+000D) and line feeds (U+000A) separate\ntokens and are otherwise insignificant: Bija is free-form, and a statement may span any number\nof lines.\n\nA comment begins with `~~` and extends to the end of the line. It is whitespace.\n\n### 2.2 Identifiers and keywords\n\n```\nidentifier = ( \"a\"..\"z\" | \"_\" ) { \"a\"..\"z\" | \"A\"..\"Z\" | \"0\"..\"9\" | \"_\" }\n```\n\nAn identifier must begin with a lowercase letter or an underscore. An identifier that begins\nwith an uppercase letter is an error.\n\nThe following are keywords and may not be used as identifiers:\n\n```\nand     attempt  deed    depth   each    end     give    in\nno      not      or      otherwise        ripen   sow\nutter   void     when    while   wither  yes\n```\n\nThe names of the builtin deeds of §9 are not keywords, but a program may not define a deed\nwith one of those names (§7.1).\n\n### 2.3 Literals\n\n```\ninteger = \"0\"..\"9\" { \"0\"..\"9\" }\n```\n\nAn integer literal denotes a non-negative integer of arbitrary size. Leading zeros are allowed\nand insignificant. There is no floating-point type in Bija.\n\n```\ntext = '\"' { character | escape } '\"'\nescape = \"\\\\\" ( \"\\\\\" | '\"' | \"n\" | \"t\" )\n```\n\nA text literal is delimited by double quotes. Inside it, `\\\\` denotes a backslash, `\\\"` a\ndouble quote, `\\n` a line feed, and `\\t` a tab. Any other character other than `\"` and `\\`\nstands for itself, including a literal line feed. A backslash followed by anything else is an\nerror. An unterminated text literal is an error.\n\n`yes` and `no` are the flag literals; `void` is the void literal.\n\n### 2.4 Operators and punctuation\n\n```\n=>   @   .   :   ,   (   )   [   ]\n+    -   *   /   %   ^\n=    <>  <   <=  >   >=\n```\n\nNote that `=` is *equality*. Bija has no assignment operator that looks like `=`; assignment is\nwritten `=>` and flows to the right (§6.1).\n\n---\n\n## 3. Values and types\n\nA Bija value has exactly one of five types.\n\n| Type   | Values                                        |\n| ------ | --------------------------------------------- |\n| `int`  | integers of arbitrary size                     |\n| `text` | finite sequences of Unicode characters         |\n| `flag` | `yes` and `no`                                 |\n| `void` | the single value `void`                        |\n| `list` | finite sequences of values, of any types       |\n\n**Every value is immutable.** No operation modifies a value in place; operations that appear to\nextend a list (§9) return a new list. Consequently Bija has no aliasing and no identity: two\nvalues are interchangeable exactly when they are equal by `=` (§5.6).\n\n### 3.1 Rendering\n\n`text(v)`, and the output of `utter` (§6.3), render a value as follows. The rendering of a\nvalue depends on whether it appears at *top level* or *nested* inside a list.\n\n| Value            | Top level                    | Nested                          |\n| ---------------- | ---------------------------- | ------------------------------- |\n| int `n`          | decimal digits, `-` if `n<0` | same                            |\n| `yes` / `no`     | `yes` / `no`                 | same                            |\n| `void`           | `void`                       | same                            |\n| text `t`         | the characters of `t`        | `\"` + escaped `t` + `\"`         |\n| list `[a, b, c]` | `[`, elements nested and separated by `, `, `]` | same         |\n\nAn empty list renders as `[]`. Escaping in the nested rendering of a text replaces `\\` with\n`\\\\`, `\"` with `\\\"`, a line feed with `\\n`, and a tab with `\\t`; every other character stands\nfor itself.\n\nExamples: `utter \"hi\".` prints `hi`; `utter [\"hi\", 3, no].` prints `[\"hi\", 3, no]`.\n\n---\n\n## 4. The storehouse\n\n### 4.1 Seeds and generations\n\nA **seed** is a named, non-empty stack of values called its **generations**. The value at the\ntop of the stack is the seed's *current* value; the one below it is one generation older, and\nso on. The number of generations is the seed's **depth**, which is at least 1.\n\n`sow x` creates a seed named `x` with a single generation. Planting a value into an existing\nseed (§6.1) pushes a generation; nothing is ever removed except by rollback (§6.8).\n\n### 4.2 Scopes\n\nA **scope** maps names to seeds. Scopes form a chain: each has at most one parent.\n\nA new scope is created on entry to each of the following, and discarded on exit:\n\n* the body of `when`, `otherwise`, `while` (one per iteration), `each` (one per iteration),\n  `attempt`, and `ripen`;\n* the body of a deed call, whose scope has **no parent**;\n* the program itself, whose scope has no parent (the *root scope*).\n\nDiscarding a scope discards the seeds it holds, along with all of their generations.\n\n**Resolving a name** means searching the current scope and then its ancestors, stopping at the\nfirst scope that holds the name. Because a deed's scope has no parent, a deed body can name\nonly its own parameters and the seeds it sows itself: it cannot see, read, or plant into the\nseeds of its caller or of the root scope. It is an error to resolve a name that is not found.\n\n`sow x` always creates the seed in the *current* scope, and it is an error if the current scope\nalready holds a seed named `x`. Sowing a name that an *ancestor* scope holds is allowed, and\nshadows it for the lifetime of the scope.\n\n### 4.3 Pendings\n\nEach scope also holds an ordered list of **pendings**, described in §6.9. A discarded scope\ndiscards its pendings, which then never run.\n\n---\n\n## 5. Expressions\n\n```\nexpression = disjunction\ndisjunction = conjunction { \"or\" conjunction }\nconjunction = negation { \"and\" negation }\nnegation = \"not\" negation | comparison\ncomparison = sum [ ( \"=\" | \"<>\" | \"<\" | \"<=\" | \">\" | \">=\" ) sum ]\nsum = product { ( \"+\" | \"-\" ) product }\nproduct = unary { ( \"*\" | \"/\" | \"%\" ) unary }\nunary = \"-\" unary | power\npower = base [ \"^\" unary ]\nbase = \"depth\" identifier | postfix\npostfix = primary { \"(\" [ arguments ] \")\" | \"[\" expression \"]\" }\narguments = expression { \",\" expression }\nprimary = integer | text | \"yes\" | \"no\" | \"void\"\n        | identifier [ \"@\" primary ]\n        | \"(\" expression \")\"\n        | \"[\" [ arguments ] \"]\"\n```\n\n`or` and `and` are left-associative; `+ - * / %` are left-associative; `^` is\nright-associative; comparison is non-associative, so `a < b < c` is a syntax error. Unary minus\nbinds tighter than any binary operator except `^`, so `-2^2` is `-(2^2)` = `-4`.\n\nEvaluation is strict and left-to-right everywhere except in `and` and `or`, which are\nshort-circuiting (§5.5). Arguments of a call are evaluated left to right, before the call.\n\n### 5.1 Literals and names\n\nAn integer, text, flag or void literal evaluates to the corresponding value. An identifier\nevaluates to the current value of the seed it resolves to (§4.2).\n\nA list expression `[e1, ..., en]` evaluates its elements left to right and yields the list of\ntheir values. `[]` is the empty list.\n\n### 5.2 Generation access\n\n`x @ k` evaluates `k`, which must be an `int`, and yields the generation of the seed `x` that\nis `k` generations older than the current one. `x @ 0` is exactly `x`. It is an error if `k` is\nnegative, and an error if `k` is greater than or equal to the depth of `x`.\n\nThe operand of `@` is always a single identifier: `f(a) @ 1` is a syntax error, and `x @ 1 @ 1`\nis a syntax error. Its right operand is a *primary*, so `x @ n` and `x @ (n + 1)` are legal but\n`x @ n + 1` parses as `(x @ n) + 1`.\n\n### 5.3 `depth`\n\n`depth x` yields the number of generations of the seed `x`, as an `int`. It is at least 1. The\noperand is always a single identifier.\n\n### 5.4 Arithmetic\n\n`+ - * / % ^` require both operands to be `int`, except that `+` also accepts two `text` values\n(concatenation) or two `list` values (concatenation). Any other combination is an error, and in\nparticular Bija never coerces between types.\n\n* `/` is division rounding toward negative infinity: `7 / 2` is `3`, `-7 / 2` is `-4`.\n* `%` is the remainder of that division, so its sign follows the divisor: `-7 % 2` is `1`.\n* `/` and `%` by zero are errors.\n* `^` requires a non-negative right operand; a negative exponent is an error.\n* Unary `-` requires an `int`.\n\n### 5.5 Logic\n\n`not e` requires `e` to be a `flag` and yields its negation.\n\n`a and b` evaluates `a`, which must be a `flag`. If it is `no`, the result is `no` and `b` is\nnot evaluated. Otherwise the result is `b`, which must be a `flag`.\n\n`a or b` evaluates `a`, which must be a `flag`. If it is `yes`, the result is `yes` and `b` is\nnot evaluated. Otherwise the result is `b`, which must be a `flag`.\n\nBija has no notion of truthiness: only `flag` values are conditions.\n\n### 5.6 Comparison\n\n`=` and `<>` accept any two values and never fail. Two values are equal when they have the same\ntype and:\n\n* two ints are numerically equal;\n* two texts are the same sequence of characters;\n* two flags are both `yes` or both `no`;\n* `void` equals `void`;\n* two lists have the same length and equal elements, pairwise.\n\n--- src tree ---\nsrc/bija/__init__.py\nsrc/bija/__pycache__/__init__.cpython-314.pyc\nsrc/bija/__pycache__/cli.cpython-314.pyc\nsrc/bija/cli.py\n--- tests tree ---\ntests/__pycache__/test_programs.cpython-314-pytest-9.1.1.pyc\ntests/programs/attempt/wither_rolls_back_a_planting.bj\ntests/programs/attempt/wither_rolls_back_a_planting.out\ntests/programs/control/each_over_list.bj\ntests/programs/control/each_over_list.out\ntests/programs/control/when_otherwise.bj\ntests/programs/control/when_otherwise.out\ntests/programs/control/while_countdown.bj\ntests/programs/control/while_countdown.out\ntests/programs/deeds/call_with_arguments.bj\ntests/programs/deeds/call_with_arguments.out\ntests/programs/errors/runtime_division_by_zero.bj\ntests/programs/errors/runtime_division_by_zero.err\ntests/programs/errors/runtime_division_by_zero.out\ntests/programs/lexical/comments.bj\ntests/programs/lexical/comments.out\ntests/programs/operators/precedence_arithmetic.bj\ntests/programs/operators/precedence_arithmetic.out\ntests/programs/ripen/fires_at_the_next_checkpoint.bj\ntests/programs/ripen/fires_at_the_next_checkpoint.out\ntests/programs/seeds/generations_are_readable.bj\ntests/programs/seeds/generations_are_readable.out\ntests/programs/seeds/plant_pushes_a_generation.bj\ntests/programs/seeds/plant_push ion on top of the old ones, and every earlier generation stays readable\\n   through the `@` operator.\\n2. **A block can be undone.** An `attempt` block that reaches `wither` rolls the storehouse\\n   back to the state it had when the block began.\\n3. **An effect can be deferred until a condition ripens.** `ripen when` registers a block that\\n   runs later, at the first point where its condition holds.\\n\\nThis document specifies the language exactly. Where it says *error*, an implementation must\\nreport an error; where it says *unspecified*, it must not.\\n\\n---\\n\\n## 1. Notation\\n\\nGrammar rules use EBNF: `|` alternation, `{ }` zero or more, `[ ]` optional, `( )` grouping,\\n`\\\"x\\\"` a literal token. Nonterminals are lowercase. The grammar is over the token stream of §2.\\n\\n---\\n\\n## 2. Lexical structure\\n\\nA source file is a sequence of Unicode characters encoded in UTF-8. It is converted to a token\\nstream by the rules below; the longest match wins at every position.\\n\\n### 2.1 Whitespace and comments\\n\\nSpaces (U+0020), tabs (U+0009), carriage returns (U+000D) and line feeds (U+000A) separate\\ntokens and are otherwise insignificant: Bija is free-form, and a statement may span any number\\nof lines.\\n\\nA comment begins with `~~` and extends to the end of the line. It is whitespace.\\n\\n### 2.2 Identifiers and keywords\\n\\n```\\nidentifier = ( \\\"a\\\"..\\\"z\\\" | \\\"_\\\" ) { \\\"a\\\"..\\\"z\\\" | \\\"A\\\"..\\\"Z\\\" | \\\"0\\\"..\\\"9\\\" | \\\"_\\\" }\\n```\\n\\nAn identifier must begin with a lowercase letter or an underscore. An identifier that begins\\nwith an uppercase letter is an error.\\n\\nThe following are keywords and may not be used as identifiers:\\n\\n```\\nand     attempt  deed    depth   each    end     give    in\\nno      not      or      otherwise        ripen   sow\\nutter   void     when    while   wither  yes\\n```\\n\\nThe names of the builtin deeds of §9 are not keywords, but a program may not define a deed\\nwith one of those names (§7.1).\\n\\n### 2.3 Literals\\n\\n```\\ninteger = \\\"0\\\"..\\\"9\\\" { \\\"0\\\"..\\\"9\\\" }\\n```\\n\\nAn integer literal denotes a non-negative integer of arbitrary size. Leading zeros are allowed\\nand insignificant. There is no floating-point type in Bija.\\n\\n```\\ntext = '\\\"' { character | escape } '\\\"'\\nescape = \\\"\\\\\\\\\\\" ( \\\"\\\\\\\\\\\" | '\\\"' | \\\"n\\\" | \\\"t\\\" )\\n```\\n\\nA text literal is delimited by double quotes. Inside it, `\\\\\\\\` denotes a backslash, `\\\\\\\"` a\\ndouble quote, `\\\\n` a line feed, and `\\\\t` a tab. Any other character other than `\\\"` and `\\\\`\\nstands for itself, including a literal line feed. A backslash followed by anything else is an\\nerror. An unterminated text literal is an error.\\n\\n`yes` and `no` are the flag literals; `void` is the void literal.\\n\\n### 2.4 Operators and punctuation\\n\\n```\\n=>   @   .   :   ,   (   )   [   ]\\n+    -   *   /   %   ^\\n=    <>  <   <=  >   >=\\n```\\n\\nNote that `=` is *equality*. Bija has no assignment operator that looks like `=`; assignment is\\nwritten `=>` and flows to the right (§6.1).\\n\\n---\\n\\n## 3. Values and types\\n\\nA Bija value has exactly one of five types.\\n\\n| Type   | Values                                        |\\n| ------ | --------------------------------------------- |\\n| `int`  | integers of arbitrary size                     |\\n| `text` | finite sequences of Unicode characters         |\\n| `flag` | `yes` and `no`                                 |\\n| `void` | the single value `void`                        |\\n| `list` | finite sequences of values, of any types       |\\n\\n**Every value is immutable.** No operation modifies a value in place; operations that appear to\\nextend a list (§9) return a new list. Consequently Bija has no aliasing and no identity: two\\nvalues are interchangeable exactly when they are equal by `=` (§5.6).\\n\\n### 3.1 Rendering\\n\\n`text(v)`, and the output    if c=='\"': self.adv(); break\n                    if c=='\\\\':\n                        self.adv(); c=self.p()\n                        if c=='\\\\': buf+='\\\\'\n                        elif c=='\"': buf+='\"'\n                        elif c=='n': buf+='\\n'\n                        elif c=='t': buf+='\\t'\n                        else: raise CompileError(self.line,self.col,'invalid escape sequence')\n                        self.adv(); continue\n                    buf+=c; self.adv()\n                out.append(Tok('TEXT',buf,line,col)); continue\n            if c.isdigit():\n                j=self.i\n                while self.p().isdigit(): self.adv()\n                out.append(Tok('INT',self.s[j:self.i],line,col)); continue\n            if c.islower() or c=='_':\n                j=self.i\n                while self.p().isalnum() or self.p()=='_': self.adv()\n                t=self.s[j:self.i]; out.append(Tok(t.upper() if t in KEYWORDS else 'IDENT',t,line,col)); continue\n            if c.isupper(): raise CompileError(line,col,'uppercase identifier')\n            two=self.s[self.i:self.i+2]\n            if two in OPS: out.append(Tok(two,two,line,col)); self.adv(2); continue\n            if c in OPS: out.append(Tok(c,c,line,col)); self.adv(); continue\n            raise CompileError(line,col,'unexpected character')\n        out.append(Tok('EOF','',self.line,self.col)); return out\n@dataclasses.dataclass\nclass Expr: kind:str; a:any=None; b:any=None; c:any=None\n@dataclasses.dataclass\nclass Stmt: kind:str; a:any=None; b:any=None; c:any=None\nclass Parser:\n    def __init__(self,t): self.t=t; self.i=0\n    def p(self): return self.t[self.i]\n    def eat(self,k=None):\n        tok=self.p()\n        if k and tok.kind!=k: raise CompileError(tok.line,tok.col,f'expected {k}')\n        self.i+=1; return tok\n    def parse(self):\n        ss=[]\n        while self.p().kind!='EOF': ss.append(self.stmt())\n        return ss\n    def stmt(self):\n        k=self.p().kind\n        if k not in {'SOW','UTTER','GIVE','WHILE','WHEN','ATTEMPT','RIPEN','DEED','EACH','WITHER'}:\n            e=self.expr()\n            if self.p().kind=='=>':\n                self.eat('=>')\n                if self.p().kind=='SOW': self.eat(); name=self.eat('IDENT').text; self.eat('.'); return Stmt('sowinit',name,e)\n                name=self.eat('IDENT').text; self.eat('.'); return Stmt('assign',name,e)\n            self.eat('.'); return Stmt('effect',e)\n        if k=='SOW': self.eat(); name=self.eat('IDENT').text; self.eat('.'); return Stmt('sow',name)\n        if k=='UTTER': self.eat(); e=self.expr(); self.eat('.'); return Stmt('utter',e)\n        if k=='GIVE': self.eat(); e=self.expr(); self.eat('.'); return Stmt('give',e)\n        if k=='WHILE': self.eat(); c=self.expr(); self.eat(':'); b=self.block({'END'}); self.eat('END'); self.eat('.'); return Stmt('while',c,b)\n        if k=='WHEN':\n            self.eat(); c=self.expr(); self.eat(':'); b=self.block({'END','OTHERWISE'})\n            o=None\n            if self.p().kind=='OTHERWISE': self.eat(); self.eat(':'); o=self.block({'END'})\n            self.eat('END'); self.eat('.'); return Stmt('when',c,b,o)\n        if k=='ATTEMPT': self.eat(); self.eat(':'); b=self.block({'END'}); self.eat('END'); self.eat('.'); return Stmt('attempt',b)\n        if k=='RIPEN': self.eat(); self.eat('WHEN'); c=self.expr(); self.eat(':'); b=self.block({'END'}); self.eat('END'); self.eat('.'); return Stmt('ripen',c,b)\n        if k=='DEED':\n            self.eat(); name=self.eat('IDENT').text; self.eat('('); ps=[]\n            if self.p().kind!=')': ps.append(self.eat('IDENT').text)\n            while self.p().kind==',': self.eat(','); ps.append(self.eat('IDENT').text)\n            self.eat(')'); self.eat(':'); b=self.block({'END'}); self.eat('END'); self.eat('.'); return Stmt('deed',name,ps,b)\n        raise CompileError(self.p().line,self.p().col,'expected statement')\n    def block(self,ends):\n        ss=[]\n        while self.p().kind not in ends: ss.append(self.stmt())\n        return ss\n    def expr(self): return self.or_()\n    def or_(self):\n        e=self.and_()\n        while self.p().kind=='OR': self.eat(); e=Expr('or',e,self.and_())\n        return e\n    def and_(self):\n        e=self.comp()\n        while self.p().kind=='AND': self.eat(); e=Expr('and',e,self.comp())\n        return e\n    def comp(self):\n        e=self.sum()\n        if self.p().kind in {'=','<>','<','<=','>','>='}:\n            op=self.eat().kind; r=self.sum()\n            if self.p().kind in {'=','<>','<','<=','>','>='}: raise CompileError(self.p().line,self.p().col,'comparison is non-associative')\n            return Expr('cmp',op,e,r)\n        return e\n    def sum(self):\n        e=self.prod()\n        while self.p().kind in {'+','-'}: op=self.eat().kind; e=Expr('bin',op,e,self.prod())\n        return e\n    def prod(self):\n        e=self.unary()\n        while self.p().kind in {'*','/','%'}: op=self.eat().kind; e=Expr('bin',op,e,self.unary())\n        return e\n    def unary(self): return Expr('neg',self.unary()) if self.p().kind=='-' else self.power()\n    def power(self): e=self.base(); return Expr('bin','^',e,self.unary()) if self.p().kind=='^' else e\n    def base(self):\n        if self.p().kind=='DEPTH': self.eat(); return Expr('depth',self.eat('IDENT').text)\n        return self.postfix()\n    def postfix(self):\n        e=self.primary()\n        while self.p().kind in {'(','['}:\n            if self.p().kind=='(':\n                self.eat('('); args=[]\n                if self.p().kind!=')': args.append(self.expr())\n                while self.p().kind==',': self.eat(','); args.append(self.expr())\n                self.eat(')'); e=Expr('call',e,args)\n            else:\n                self.eat('['); idx=self.expr(); self.eat(']'); e=Expr('index',e,idx)\n        return e\n    def primary(self):\n        k=self.p().kind\n        if k=='INT': return Expr('int',int(self.eat().text))\n ecification is in SPEC.md. This package is a skeleton: only the command line exists, and\nit does nothing yet.\n\"\"\"\n\n__version__ = \"0.0.0\"\n--- cli.py ---\n\"\"\"The `bija` command: run a program, or build Python from it.\n\nNothing here is implemented yet. SPEC.md defines the language; `tests/programs/` holds the\nacceptance suite that decides whether an implementation is correct.\n\nThe contract the tests rely on:\n\n* `bija run FILE` compiles FILE and runs it, writing the program's output to standard output.\n* `bija build FILE [-o OUT]` writes standalone Python — a file that produces exactly the same\n  output under a bare interpreter, with no import of this package.\n* Exit codes are 0 for success, 1 for a runtime error (reported as `error: MESSAGE` on standard\n  error), and 2 for a compile-time error (reported as `FILE:LINE:COLUMN: error: MESSAGE`).\n\"\"\"\n\nfrom __future__ import annotations\n\nimport sys\n\n\ndef main(argv: list[str] | None = None) -> int:\n    sys.stderr.write(\"bija: not implemented yet — see SPEC.md\\n\")\n    return 70\n\n\nif __name__ == \"__main__\":\n    raise SystemExit(main())\n"},"type":"observation"},{"callId":"call_sKKmZBUoFwFSum2fINZxHswk","content":{"error":null,"exit_code":0,"output":"\"\"\"The acceptance suite: every test is a whole Bija program, checked against its output.\n\nFor each `NAME.bj` under `tests/programs/`:\n\n* `NAME.out`    — the exact expected standard output (required).\n* `NAME.err`    — the exact expected standard error, when the program is meant to fail.\n* `NAME.status` — the expected exit code; defaults to 0, or 1 when `NAME.err` is present.\n\nPrograms are run through the real command line, from their own directory, so a diagnostic\nnaming the source file is stable. Each program is also compiled to standalone Python and run\nunder a bare interpreter, which is what `bija build` promises.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport subprocess\nimport sys\nfrom pathlib import Path\n\n t by rollback (§6.8).\n\n### 4.2 Scopes\n\nA **scope** maps names to seeds. Scopes form a chain: each has at most one parent.\n\nA new scope is created on entry to each of the following, and discarded on exit:\n\n* the body of `when`, `otherwise`, `while` (one per iteration), `each` (one per iteration),\n  `attempt`, and `ripen`;\n* the body of a deed call, whose scope has **no parent**;\n* the program itself, whose scope has no parent (the *root scope*).\n\nDiscarding a scope discards the seeds it holds, along with all of their generations.\n\n**Resolving a name** means searching the current scope and then its ancestors, stopping at the\nfirst scope that holds the name. Because a deed's scope has no parent, a deed body can name\nonly its own parameters and the seeds it sows itself: it cannot see, read, or plant into the\nseeds of its caller or of the root scope. It is an error to resolve a name that is not found.\n\n`sow x` always creates the seed in the *current* scope, and it is an error if the current scope\nalready holds a seed named `x`. Sowing a name that an *ancestor* scope holds is allowed, and\nshadows it for the lifetime of the scope.\n\n### 4.3 Pendings\n\nEach scope also holds an ordered list of **pendings**, described in §6.9. A discarded scope\ndiscards its pendings, which then never run.\n\n---\n\n## 5. Expressions\n\n```\nexpression = disjunction\ndisjunction = conjunction { \"or\" conjunction }\nconjunction = negation { \"and\" negation }\nnegation = \"not\" negation | comparison\ncomparison = sum [ ( \"=\" | \"<>\" | \"<\" | \"<=\" | \">\" | \">=\" ) sum ]\nsum = product { ( \"+\" | \"-\" ) product }\nproduct = unary { ( \"*\" | \"/\" | \"%\" ) unary }\nunary = \"-\" unary | power\npower = base [ \"^\" unary ]\nbase = \"depth\" identifier | postfix\npostfix = primary { \"(\" [ arguments ] \")\" | \"[\" expression \"]\" }\narguments = expression { \",\" expression }\nprimary = integer | text | \"yes\" | \"no\" | \"void\"\n        | identifier [ \"@\" primary ]\n        | \"(\" expression \")\"\n        | \"[\" [ arguments ] \"]\"\n```\n\n`or` and `and` are left-associative; `+ - * / %` are left-associative; `^` is\nright-associative; comparison is non-associative, so `a < b < c` is a syntax error. Unary minus\nbinds tighter than any binary operator except `^`, so `-2^2` is `-(2^2)` = `-4`.\n\nEvaluation is strict and left-to-right everywhere except in `and` and `or`, which are\nshort-circuiting (§5.5). Arguments of a call are evaluated left to right, before the call.\n\n### 5.1 Literals and names\n\nAn integer, text, flag or void literal evaluates to the corresponding value. An identifier\nevaluates to the current value of the seed it resolves to (§4.2).\n\nA list expression `[e1, ..., en]` evaluates its elements left to right and yields the list of\ntheir values. `[]` is the empty list.\n\n### 5.2 Generation access\n\n`x @ k` evaluates `k`, which must be an `int`, and yields the generation of the seed `x` that\nis `k` generations older than the current one. `x @ 0` is exactly `x`. It is an error if `k` is\nnegative, and an error if `k` is greater than or equal to the depth of `x`.\n\nThe operand of `@` is always a single identifier: `f(a) @ 1` is a syntax error, and `x @ 1 @ 1`\nis a syntax error. Its right operand is a *primary*, so `x @ n` and `x @ (n + 1)` are legal but\n`x @ n + 1` parses as `(x @ n) + 1`.\n\n### 5.3 `depth`\n\n`depth x` yields the number of generations of the seed `x`, as an `int`. It is at least 1. The\noperand is always a single identifier.\n\n### 5.4 Arithmetic\n\n`+ - * / % ^` r\n\n=== ## 4. Seeds and storehouse ===\n\n\n=== ## 5. Expressions ===\n## 5. Expressions\n\n```\nexpression = disjunction\ndisjunction = conjunction { \"or\" conjunction }\nconjunction = negation { \"and\" negation }\nnegation = \"not\" negation | comparison\ncomparison = sum [ ( \"=\" | \"<>\" | \"<\" | \"<=\" | \">\" | \">=\" ) sum ]\nsum = product { ( \"+\" | \"-\" ) product }\nproduct = unary { ( \"*\" | \"/\" | \"%\" ) unary }\nunary = \"-\" unary | power\npower = base [ \"^\" unary ]\nbase = \"depth\" identifier | postfix\npostfix = primary { \"(\" [ arguments ] \")\" | \"[\" expression \"]\" }\narguments = expression { \",\" expression }\nprimary = integer | text | \"yes\" | \"no\" | \"void\"\n        | identifier [ \"@\" primary ]\n        | \"(\" expression \")\"\n        | \"[\" [ arguments ] \"]\"\n```\n\n`or` and `and` are left-associative; `+ - * / %` are left-associative; `^` is\nright-associative; comparison is non-associative, so `a < b < c` is a syntax error. Unary minus\nbinds tighter than any binary operator except `^`, so `-2^2` is `-(2^2)` = `-4`.\n\nEvaluation is strict and left-to-right everywhere except in `and` and `or`, which are\nshort-circuiting (§5.5). Arguments of a call are evaluated left to right, before the call.\n\n### 5.1 Literals and names\n\nAn integer, text, flag or void literal evaluates to the corresponding value. An identifier\nevaluates to the current value of the seed it resolves to (§4.2).\n\nA list expression `[e1, ..., en]` evaluates its elements left to right and yields the list of\ntheir values. `[]` is the empty list.\n\n### 5.2 Generation access\n\n`x @ k` evaluates `k`, which must be an `int`, and yields the generation of the seed `x` that\nis `k` generations older than the current one. `x @ 0` is exactly `x`. It is an error if `k` is\nnegative, and an error if `k` is greater than or equal to the depth of `x`.\n\nThe operand of `@` is always a single identifier: `f(a) @ 1` is a syntax error, and `x @ 1 @ 1`\nis a syntax error. Its right operand is a *primary*, so `x @ n` and `x @ (n + 1)` are legal but\n`x @ n + 1` parses as `(x @ n) + 1`.\n\n### 5.3 `depth`\n\n`depth x` yields the number of generations of the seed `x`, as an `int`. It is at least 1. The\noperand is always a single identifier.\n\n### 5.4 Arithmetic\n\n`+ - * / % ^` require both operands to be `int`, except that `+` also accepts two `text` values\n(concatenation) or two `list` values (concatenation). Any other combination is an error, and in\nparticular Bija never coerces between types.\n\n* `/` is division rounding toward negative infinity: `7 / 2` is `3`, `-7 / 2` is `-4`.\n* `%` is the remainder of that division, so its sign follows the divisor: `-7 % 2` is `1`.\n* `/` and `%` by zero are errors.\n* `^` requires a non-negative right operand; a negative exponent is an error.\n* Unary `-` requires an `int`.\n\n### 5.5 Logic\n\n`not e` requires `e` to be a `flag` and yields its negation.\n\n`a and b` evaluates `a`, which must be a `flag`. If it is `no`, the result is `no` and `b` is\nnot evaluated. Otherwise the result is `b`, which must be a `flag`.\n\n`a or b` evaluates `a`, which must be a `flag`. If it is `yes`, the result is `yes` and `b` is\nnot evaluated. Otherwise the result is `b`, which must be a `flag`.\n\nBija has no notion of truthiness: only `flag` values are conditions.\n\n### 5.6 Comparison\n\n`=` and `<>` accept any two values and never fail. Two values are equal when they have the same\ntype and:\n\n* two ints are numerically equal;\n* two texts are the same sequence of characters;\n* two flags are both `yes` or both `no`;\n* `void` equals `void`;\n* two lists have the same length and equal elements, pairwise.\n\nValues of different types are never equal, so `1 = yes` is `no` rather than an error.\n\n`< <= > >=` require both operands to be `int`, or both to be `text`. Texts are ordered\nlexicographically by Unicode code point. Any other operand types are an error.\n\n### 5.7 Indexing\n\n`e[i]` requires `e` to be a `text` or a `list` and `i` to be an `int`. Indices are 0-based.\nNegative indices are an error — Bija does not index from the end — as is an index greater than\nor equal to the length. Indexing a text yields a text of length 1.\n\n### 5.8 Calls\n\n`f(a1, ..., an)` calls the deed named `f` (§7) or the builtin deed of that name (§9). The name\nmust be resolvable at compile time, and the number of arguments must match the deed's; both are\ncompile-time errors otherwise. A call is an expression and yields the deed's result.\n\n---\n\n## 6. Statements\n\n```\nstatement = plant | sow | utter | when | while | each | deed\n          | give | attempt | wither | ripen | effect\n```\n\n**Every statement ends with a full stop `.`**, including the block statements: the `end` of a\n`when` is followed by `.`.\n\nA **block** is a sequence of zero or more statements. Statements run in order.\n\n### 6.1 Planting\n\n```\nplant = expression \"=>\" ( identifier | \"sow\" identifier ) \".\"\n```\n\n`e => x.` evaluates `e` and pushes its value as a new generation of the seed that `x` resolves\nto. The seed's earlier generations remain readable through `@`. It is an error if `x` does not\nresolve.\n\n`e => sow x.` evaluates `e`, creates a seed na\n\n=== ## 6. Statements ===\n## 6. Statements\n\n```\nstatement = plant | sow | utter | when | while | each | deed\n          | give | attempt | wither | ripen | effect\n```\n\n**Every statement ends with a full stop `.`**, including the block statements: the `end` of a\n`when` is followed by `.`.\n\nA **block** is a sequence of zero or more statements. Statements run in order.\n\n### 6.1 Planting\n\n```\nplant = expression \"=>\" ( identifier | \"sow\" identifier ) \".\"\n```\n\n`e => x.` evaluates `e` and pushes its value as a new generation of the seed that `x` resolves\nto. The seed's earlier generations remain readable through `@`. It is an error if `x` does not\nresolve.\n\n`e => sow x.` evaluates `e`, creates a seed named `x` in the current scope with that value as\nits single generation, and is an error if the current scope already holds `x`.\n\n### 6.2 Sowing\n\n```\nsow = \"sow\" identifier \".\"\n```\n\n`sow x.` creates a seed named `x` in the current scope whose single generation is `void`. It is\nequivalent to `void => sow x.`.\n\n### 6.3 Uttering\n\n```\nutter = \"utter\" expression \".\"\n```\n\nEvaluates the expression, renders it at top level (§3.1), and writes the rendering followed by\na line feed to standard output. Output is written when the statement runs and is never undone\nby a rollback (§6.8).\n\n### 6.4 Conditionals\n\n```\nwhen = \"when\" expression \":\" block [ \"otherwise\" \":\" block ] \"end\" \".\"\n```\n\nEvaluates the condition, which must be a `flag`. If it is `yes`, the first block runs in a new\nscope; otherwise the `otherwise` block, if present, runs in a new scope.\n\n### 6.5 While loops\n\n```\nwhile = \"while\" expression \":\" block \"end\" \".\"\n```\n\nEvaluates the condition, which must be a `flag`, before each iteration. While it is `yes`, the\nblock runs in a **fresh scope per iteration** — so a seed sown in the body starts each\niteration with a depth of 1, and cannot be read across iterations.\n\n### 6.6 Each loops\n\n```\neach = \"each\" identifier \"in\" expression \":\" block \"end\" \".\"\n```\n\nEvaluates the expression, which must be a `list` or a `text`. For each element in order — the\nelements of a list, or the one-character texts of a text — a fresh scope is created, a seed\nwith the loop's name is sown in it with that element as its value, and the block runs. The\nsequence is evaluated once, before the first iteration; because values are immutable, nothing\ncan change it during the loop.\n\n### 6.7 Deeds and giving\n\n```\ndeed = \"deed\" identifier \"(\" [ identifier { \",\" identifier } ] \")\" \":\" block \"end\" \".\"\ngive = \"give\" [ expression ] \".\"\n```\n\nSee §7.\n\n### 6.8 Attempt and wither\n\n```\nattempt = \"attempt\" \":\" block \"end\" \".\"\nwither = \"wither\" \".\"\n```\n\n`attempt` records a **mark** — the depth of every seed reachable from the current scope — and\nthen runs its block in a new scope.\n\nIf the block finishes normally, nothing is undone: the mark is discarded and execution\ncontinues after `end`.\n\nIf `wither` runs at any point during the *dynamic extent* of the block — including inside a\ndeed called from it, however deeply — control leaves the block immediately and the storehouse\nis rolled back to the mark:\n\n* every seed that existed at the mark has its generations above the marked depth removed, so\n  its current value is again the value it had when the `attempt` began;\n* every scope created inside the block is discarded, and with it every seed sown there;\n* every pending registered inside the block is discarded, and never runs.\n\nExecution then continues with the statement after `end.`, exactly as if the block had finished\nnormally.\n\n`wither` unwinds to the innermost `attempt` in the dynamic extent. It is an error to run\n`wither` when there is no such `attempt`.\n\nNote what is *not* undone: output already written (§6.3). A rollback restores the storehouse,\nnot the world.\n\n### 6.9 Ripening\n\n```\nripen = \"ripen\" \"when\" expression \":\" block \"end\" \".\"\n```\n\n`ripen when c: b end.` does **not** evaluate `c` and does not run `b`. It registers a\n*pending*, holding the unevaluated condition and block, at the end of the pending list of the\nscope in which the statement appears.\n\nA **checkpoint** happens immediately after each statement of a block finishes, in the scope of\nthat block. At a checkpoint, the scope's pending list is scanned from its first element:\n\n* the pending's condition is evaluated, in the scope that holds the pending, and must be a\n  `flag`;\n* if it is `no`, the scan moves to the next pending, and the pending stays in the list;\n* if it is `yes`, the pending is removed from the list, and its block runs in a new scope whose\n  parent is the scope that held the pending;\n* the scan then continues with the pending that now follows the position just examined;\n* the scan ends when it passes the end of the list.\n\nA checkpoint therefore runs each pending at most once, in registration order, and can cascade:\na block that ripens early in the scan may make a later pending's condition true, and that one\nthen ripens in the same checkpoint.\n\nA pending belongs to exactly one scope: the one holding the block in which\n\n=== ## 7. Deeds ===\n## 7. Deeds\n\n```\ndeed = \"deed\" identifier \"(\" [ parameters ] \")\" \":\" block \"end\" \".\"\n```\n\nA deed is a named procedure. Deeds may be declared only at the top level of a program, never\ninside another statement, and a program may not declare two deeds with the same name, nor a\ndeed whose name is that of a builtin (§9). Deeds are not values: a name may be used as a deed\nonly in a call.\n\nBecause deed declarations are gathered before the program runs, a deed may call a deed declared\nlater in the file, and may call itself.\n\n### 7.1 Calling\n\nA call evaluates its arguments left to right, creates a **parentless** scope, sows one seed per\nparameter in that scope with the corresponding argument value, and runs the body in it. The\nparameters are ordinary seeds: they may be planted into, and their generations accumulate as\nusual.\n\n`give e.` evaluates `e` and ends the call with that value. `give.` ends the call with `void`. A\nbody that finishes without giving yields `void`.\n\nRecursion is permitted. An implementation may impose a limit on recursion depth; exceeding it\nis an error.\n\n---\n\n## 8. Programs\n\n```\nprogram = { statement }\n```\n\nA program is a block, run in the root scope. Deed declarations anywhere in it are collected\nbefore execution and are not themselves executed. The program ends when its last statement has\nfinished, or when a runtime error occurs.\n\n### 8.1 Errors\n\nA **compile-time error** is a violation of §2 (lexical), §5–§8 (syntactic), or one of these\nstatic rules: an unknown deed name in a call, a wrong number of arguments, a duplicate deed\nname, a deed named after a builtin, a deed declared other than at the top level, a `give`\noutside a deed, and a `give` inside a `ripen` block. An implementation must report the first\nsuch error with its line and column, and must not run the program.\n\nA **runtime error** is any of the conditions this document calls an error at run time. It ends\nthe program immediately: no further statement runs, and no pending ripens. Output already\nwritten stands.\n\nA program that completes normally succeeds. A program that fails at compile time or at run time\nfails, and the two are distinguishable by the reported message.\n\n---\n\n## 9. Builtin deeds\n\nBuiltins are called like deeds. Their argument types are checked, and a mismatch is a runtime\nerror.\n\n| Call                     | Result                                                                 |\n| ------------------------ | ---------------------------------------------------------------------- |\n| `len(v)`                 | length of a text or a list, as an `int`                                 |\n| `push(l, v)`             | a new list: the elements of list `l` followed by `v`                    |\n| `slice(s, a, b)`         | elements `a` up to but excluding `b` of a text or list                  |\n| `join(l, sep)`           | the texts in list `l` joined by text `sep`                              |\n| `chars(t)`               | the list of one-character texts of text `t`                             |\n| `text(v)`                | the top-level rendering of any value (§3.1), as a text                  |\n| `number(t)`              | the integer denoted by text `t`                                         |\n| `range(a, b)`            | the list `[a, a+1, ..., b-1]`, empty when `a >= b`                       |\n| `has(s, v)`              | `yes` when value `v` occurs in list `s`, or text `v` occurs in text `s` |\n\n* `slice` requires `0 <= a <= b <= len(s)`; anything else is an error.\n* `join` requires every element of `l` to be a text.\n* `number` accepts an optional `-` followed by one or more decimal digits and nothing else; any\n  other text is an error.\n* `range` requires two ints.\n* `has` on a text requires `v` to be a text, and tests for a contiguous substring; the empty\n  text occurs in every text.\n\n---\n\n## 10. A complete example\n\n```\n~~ Collatz, with a rollback and a deferred report.\n\ndeed step(n):\n  when n % 2 = 0:\n    give n / 2.\n  otherwise:\n    give 3 * n + 1.\n  end.\nend.\n\n27 => sow n.\n0 => sow steps.\n\nripen when n = 1:\n  utter \"reached 1 in \" + text(steps) + \" steps\".\nend.\n\nwhile n <> 1:\n  step(n) => n.\n  steps + 1 => steps.\nend.\n\nutter \"highest generation still readable: \" + text(n@steps).\n\nattempt:\n  999 => n.\n  utter \"inside: \" + text(n).\n  wither.\nend.\n\nutter \"after wither: \" + text(n).\n```\n\nThis prints:\n\n```\nreached 1 in 111 steps\nhighest generation still readable: 27\ninside: 999\nafter wither: 1\n```\n\nThe pending ripens at the first checkpoint after `n` becomes 1 — that is, after the assignment\nin the loop body's enclosing block, which is the program block, so it ripens after the `while`\nstatement finishes. The generation `n@steps` is the value `n` held 111 assignments ago, the\nseed's original 27. The `attempt` plants 999, utters it, and withers, so the last statement\nsees 1 again, but the `inside:` line has already been written and stays.\n\n\n=== ## 8. Program execution ===\n\n\n=== ## 9. Builtin deeds ===\n## 9. Builtin deeds\n\nBuiltins are called like deeds. Their argument types are checked, and a mismatch is a runtime\nerror.\n\n| Call                     | Result                                                                 |\n| ------------------------ | ---------------------------------------------------------------------- |\n| `len(v)`                 | length of a text or a list, as an `int`                                 |\n| `push(l, v)`             | a new list: the elements of list `l` followed by `v`                    |\n| `slice(s, a, b)`         | elements `a` up to but excluding `b` of a text or list                  |\n| `join(l, sep)`           | the texts in list `l` joined by text `sep`   |\\n| ------------------------ | ---------------------------------------------------------------------- |\\n| `len(v)`                 | length of a text or a list, as an `int`                                 |\\n| `push(l, v)`             | a new list: the elements of list `l` followed by `v`                    |\\n| `slice(s, a, b)`         | elements `a` up to but excluding `b` of a text or list                  |\\n| `join(l, sep)`           | the texts in list `l` joined by text `sep`                              |\\n| `chars(t)`               | the list of one-character texts of text `t`                             |\\n| `text(v)`                | the top-level rendering of any value (§3.1), as a text                  |\\n| `number(t)`              | the integer denoted by text `t`                                         |\\n| `range(a, b)`            | the list `[a, a+1, ..., b-1]`, empty when `a >= b`                       |\\n| `has(s, v)`              | `yes` when value `v` occurs in list `s`, or text `v` occurs in text `s` |\\n\\n* `slice` requires `0 <= a <= b <= len(s)`; anything else is an error.\\n* `join` requires every element of `l` to be a text.\\n* `number` accepts an optional `-` followed by one or more decimal digits and nothing else; any\\n  other text is an error.\\n* `range` requires two ints.\\n* `has` on a text requires `v` to be a text, and tests for a contiguous substring; the empty\\n  text occurs in every text.\\n\\n---\\n\\n## 10. A complete example\\n\\n```\\n~~ Collatz, with a rollback and a deferred report.\\n\\ndeed step(n):\\n  when n % 2 = 0:\\n    give n / 2.\\n  otherwise:\\n    give 3 * n + 1.\\n  end.\\nend.\\n\\n27 => sow n.\\n0 => sow steps.\\n\\nripen when n = 1:\\n  utter \\\"reached 1 in \\\" + text(steps) + \\\" steps\\\".\\nend.\\n\\nwhile n <> 1:\\n  step(n) => n.\\n  steps + 1 => steps.\\nend.\\n\\nutter \\\"highest generation still readable: \\\" + text(n@steps).\\n\\nattempt:\\n  999 => n.\\n  utter \\\"inside: \\\" + text(n).\\n  wither.\\nend.\\n\\nutter \\\"after wither: \\\" + text(n).\\n```\\n\\nThis prints:\\n\\n```\\nreached 1 in 111 steps\\nhighest generation still readable: 27\\ninside: 999\\nafter wither: 1\\n```\\n\\nThe pending ripens at the first checkpoint after `n` becomes 1 — that is, after the assignment\\nin the loop body's enclosing block, which is the program block, so it ripens after the `while`\\nstatement finishes. The generation `n@steps` is the value `n` held 111 assignments ago, the\\nseed's original 27. The `attempt` plants 999, utters it, and withers, so the last statement\\nsees 1 again, but the `inside:` line has already been written and stays.\\n\\n\",\n \"output_head\":\n \"\\n=== ## 3.1 Rendering ===\\n## 3.1 Rendering\\n\\n`text(v)`, and the output of `utter` (§6.3), render a value as follows. The rendering of a\\nvalue depends on whether it appears at *top level* or *nested* inside a list.\\n\\n| Value            | Top level                    | Nested                          |\\n| ---------------- | ---------------------------- | ------------------------------- |\\n| int `n`          | decimal digits, `-` if `n<0` | same                            |\\n| `yes` / `no`     | `yes` / `no`                 | same                            |\\n| `void`           | `void`                       | same                            |\\n| text `t`         | the characters of `t`        | `\\\"` + escaped `t` + `\\\"`         |\\n| list `[a, b, c]` | `[`, elements nested and separated by `, `, `]` | same         |\\n\\nAn empty list renders as `[]`. Escaping in the nested rendering of a text replaces `\\\\` with\\n`\\\\\\\\`, `\\\"` with `\\\\\\\"`, a line feed with `\\\\n`, and a tab with `\\\\t`; every other character stands\\nfor itself.\\n\\nExamples: `utter \\\"hi\\\".` prints `hi`; `utter [\\\"hi\\\", 3, no].` prints `[\\\"hi\\\", 3, no]`.\\n\\n---\\n\\n## 4. The storehouse\\n\\n### 4.1 Seeds and generations\\n\\nA **seed** is a named, non-empty stack of values called its **generations**. The value at the\\ntop of the stack is the seed's *current* value; the one below it is one generation older, and\\nso on. The number of generations is the seed's **depth**, which is at least 1.\\n\\n`sow x` creates a seed named `x` with a single generation. Planting a value into an existing\\nseed (§6.1) pushes a generation; nothing is ever removed except by rollback (§6.8).\\n\\n### 4.2 Scopes\\n\\nA **scope** maps names to seeds. Scopes form a chain: each has at most one parent.\\n\\nA new scope is created on entry to each of the following, and discarded on exit:\\n\\n* the body of `when`, `otherwise`, `while` (one per iteration), `each` (one per iteration),\\n  `attempt`, and `ripen`;\\n* the body of a deed call, whose scope has **no parent**;\\n* the program itself, whose scope has no parent (the *root scope*).\\n\\nDiscarding a scope discards the seeds it holds, along with all of their generations.\\n\\n**Resolving a name** means searching the current scope and then its ancestors, stopping at the\\nfirst scope that holds the name. Because a deed's scope has no parent, a deed body can name\\nonly its own parameters and the seeds it sows itself: it cannot see, read, or plant into the\\nseeds of its caller or of the root scope. It is an error to resolve a name that is not found.\\n\\n`sow x` always creates the seed in the *current* scope, and it is an error if the current scope\\nalready holds a seed named `x`. Sowing a name that an *ancestor* scope holds is allowed, and\\nshadows it for the lifetime of the scope.\\n\\n### 4.3 Pendings\\n\\nEach scope also holds an ordered list of **pendings**, described in §6.9. A discarded scope\\ndiscards its pendings, which then never run.\\n\\n---\\n\\n## 5. Expressions\\n\\n```\\nexpression = disjunction\\ndisjunction = conjunction { \\\"or\\\" conjunction }\\nconjunction = negation { \\\"and\\\" negation }\\nnegation = \\\"not\\\" negation | comparison\\ncomparison = sum [ ( \\\"=\\\" | \\\"<>\\\" | \\\"<\\\" | \\\"<=\\\" | \\\">\\\" | \\\">=\\\" ) sum ]\\nsum = product { ( \\\"+\\\" | \\\"-\\\" ) product }\\nproduct = unary { ( \\\"*\\\" | \\\"/\\\" | \\\"%\\\" ) unary }\\nunary = \\\"-\\\" unary | power\\npower = base [ \\\"^\\\" unary ]\\nbase = \\\"depth\\\" identifier | postfix\\npostfix = primary { \\\"(\\\" [ arguments ] \\\")\\\" | \\\"[\\\" expression \\\"]\\\" }\\narguments = expression { \\\",\\\" expression }\\nprimary = integer | text | \\\"yes\\\" | \\\"no\\\" | \\\"void\\\"\\n        | identifier [ \\\"@\\\" primary ]\\n        | \\\"(\\\" expression \\\")\\\"\\n        | \\\"[\\\" [ arguments ] \\\"]\\\"\\n```\\n\\n`or` and `and` are left-associative; `+ - * / %` are left-associative; `^` is\\nright-associative; comparison is non-associative, so `a < b < c` is a syntax error. Unary minus\\nbinds tighter than any binary operator except `^`, so `-2^2` is `-(2^2)` = `-4`.\\n\\nEvaluation is strict and left-to-right everywhere except in `and` and `or`, which are\\nshort-circuiting (§5.5). Arguments of a call are evaluated left to right, before the call.\\n\\n### 5.1 Literals and names\\n\\nAn integer, text, flag or void literal evaluates to the corresponding value. An identifier\\nevaluates to the current value of the seed it resolves to (§4.2).\\n\\nA list expression `[e1, ..., en]` evaluates its elements left to right and yields the list of\\ntheir values. `[]` is the empty list.\\n\\n### 5.2 Generation access\\n\\n`x @ k` evaluates `k`, which must be an `int`, and yields the generation of the seed `x` that\\nis `k` generations older than the current one. `x @ 0` is exactly `x`. It is an error if `k` is\\nnegative, and an error if `k` is greater than or equal to the depth of `x`.\\n\\nThe operand of `@` is always a single identifier: `f(a) @ 1` is a syntax error, and `x @ 1 @ 1`\\nis a syntax error. Its right operand is a *primary*, so `x @ n` and `x @ (n + 1)` are legal but\\n`x @ n + 1` parses as `(x @ n) + 1`.\\n\\n### 5.3 `depth`\\n\\n`depth x` yields the number of generations of the seed `x`, as an `int`. It is at least 1. The\\noperand is always a single identifier.\\n\\n### 5.4 A\",\n \"exit_code\": 0,\n \"elided_chars\": 12841}","role":"tool","tool_call_id":"call_uAFIV0Cdd7NzG92euHn3FS32"}],"wireFull":false,"wireOwn":2,"workspace":"49df52d977eeed0d56bef9b8fdfb596429cd37238c8c24a2c427aeb43c79fee0"},{"changeCount":1,"changes":[{"kind":"modified","new":"from __future__ import annotations\nimport argparse, dataclasses, sys\nfrom pathlib import Path\nclass CompileError(Exception):\n    def __init__(self,line,col,msg): self.line=line; self.col=col; self.msg=msg\nclass RuntimeErrorBija(Exception): pass\n@dataclasses.dataclass\nclass Tok: kind:str; text:str; line:int; col:int\nKEYWORDS={\"and\",\"attempt\",\"deed\",\"depth\",\"each\",\"end\",\"give\",\"in\",\"no\",\"not\",\"or\",\"otherwise\",\"ripen\",\"sow\",\"utter\",\"void\",\"when\",\"while\",\"wither\",\"yes\"}\nOPS={\"=>\",\"@\",\".\",\":\",\",\",\"(\",\")\",\"[\",\"]\",\"+\",\"-\",\"*\",\"/\",\"%\",\"^\",\"=\",\"<>\",\"<\",\"<=\",\">\",\">=\"}\nclass Lexer:\n    def __init__(self,s): self.s=s; self.i=0; self.line=1; self.col=1\n    def p(self,n=0): return self.s[self.i+n] if self.i+n<len(self.s) else ''\n    def adv(self,n=1):\n        for _ in range(n):\n            c=self.p(); self.i+=1\n            if c=='\\n': self.line+=1; self.col=1\n            else: self.col+=1\n    def toks(self):\n        out=[]\n        while self.i<len(self.s):\n            c=self.p()\n            if c in ' \\t\\r\\n': self.adv(); continue\n            if c=='~' and self.p(1)=='~':\n                while self.i<len(self.s) and self.p()!='\\n': self.adv()\n                continue\n            line,col=self.line,self.col\n            if c=='\"':\n                self.adv(); buf=''\n                while True:\n                    if self.i>=len(self.s): raise CompileError(line,col,'unterminated text literal')\n                    c=self.p()\n
