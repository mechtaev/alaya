[project]
name = "bija"
version = "1.0.0"
description = "A compiler for Bija, an imperative language whose seeds remember every generation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
bija = "bija.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "coverage>=7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bija"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/bija"]
parallel = true
concurrency = ["multiprocessing"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "raise AssertionError"]
